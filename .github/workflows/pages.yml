# Builds the browser-only version of SlideCraft (`npm run build:pages`) and publishes it to
# GitHub Pages on every push to main. It runs the server's slide code in the page, so it needs
# the server's packages installed, but not Chrome (PDFs use the browser's print dialog there).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces one that is waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Install packages
        run: npm ci --prefix server && npm ci --prefix client
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Build the browser-only app
        run: npm run build:pages --prefix client
      - uses: actions/upload-pages-artifact@v5
        with:
          path: client/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
